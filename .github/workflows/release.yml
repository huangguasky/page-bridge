name: Build and release desktop apps

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: windows
            arch: x64
          - name: macOS x64
            os: macos-15-intel
            platform: mac
            arch: x64
          - name: macOS Apple Silicon
            os: macos-15
            platform: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Build Windows installer
        if: matrix.platform == 'windows'
        run: npm run dist -- --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build ad-hoc signed macOS installer
        if: matrix.platform == 'mac'
        run: npm run dist -- --mac --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify macOS ad-hoc signature
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          app="$(find release -type d -name 'Page Bridge.app' -print -quit)"
          if [[ -z "$app" ]]; then
            echo "::error::Built application bundle was not found."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
          signature="$(codesign -dv "$app" 2>&1)"
          if [[ "$signature" != *"Signature=adhoc"* ]]; then
            echo "::error::Expected an ad-hoc signature."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.exe
            artifacts/*.dmg
